[package]
name = "luthor"
version = "0.1.0"
edition = "2024"

[dependencies]
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["xtask"]
resolver = "3"
